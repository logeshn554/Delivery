version: "3.9"

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: deliveryos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deliveryos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: deliveryos_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: deliveryos_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@postgres:5432/deliveryos
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    env_file:
      - .env

  # ─── Worker ───────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: deliveryos_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@postgres:5432/deliveryos
      REDIS_URL: redis://redis:6379
    env_file:
      - .env

  # ─── Customer Web ─────────────────────────────────────────────────────────
  customer-web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        APP: customer-web
    container_name: deliveryos_customer_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env

  # ─── Admin Web ────────────────────────────────────────────────────────────
  admin-web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        APP: admin-web
    container_name: deliveryos_admin_web
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env

  # ─── Business Web ─────────────────────────────────────────────────────────
  business-web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        APP: business-web
    container_name: deliveryos_business_web
    restart: unless-stopped
    ports:
      - "3002:3000"
    env_file:
      - .env

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: deliveryos_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - api
      - customer-web
      - admin-web

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: deliveryos_network
